id: object260-t3485-model
name: Объект 260 как T-34-85
version: 1.0.0
author: BlitzForge SDK
description: Клиентская замена модели Объекта 260 на штатную модель T-34-85
type: native
long: |
  Через vehicle skin API перенаправляет R110_Object_260.sc2 и
  R110_Object_260.scg на штатные T-34-85.sc2 и T-34-85.scg.
  Архив не содержит моделей или текстур игры: мод использует assets уже
  установленного клиента. Замена только визуальная; коллизия и игровые
  характеристики Объекта 260 не меняются. Для обновления уже загруженной
  модели смените танк в ангаре или перезайдите в бой.
