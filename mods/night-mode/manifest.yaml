long: |
  Ночная цветокоррекция боевой сцены. Затемняет и обесцвечивает мир,
  сохраняя относительный контраст: ничто не становится заметнее, чем в оригинале.
  Раздельное тонирование теней и светов, S-кривая по яркости.
  Затрагивает ландшафт, технику, небо, воду и растительность. Интерфейс не трогает.
  Бронепробитие, outline и другие штатные gameplay overlays сохраняют исходные цвета.
