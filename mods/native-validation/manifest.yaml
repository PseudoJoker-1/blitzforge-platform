long: |
  Внутренний validation-мод с экранной панелью, PASS/FAIL/SKIP/RESET,
  exact-fingerprint результатами, privacy-safe JSONL trace и crash recovery.
  Native capability не получает SUPPORTED до ручного PASS на точном SHA клиента.
  Секция Hooks содержит по одной строке на каждый из 42 опубликованных
  hook-символов: проба вызывает create_symbol в режиме OBSERVE без флагов,
  поэтому detour никогда не устанавливается, и по коду возврата видно,
  разрешается ли символ на этом клиенте. Клавиша H прогоняет все пробы разом.
