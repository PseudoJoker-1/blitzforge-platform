<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · BlitzForge</title>
<meta name="description" content="{{description}}">
<link rel="stylesheet" href="/static/app.css?v={{asset_v}}">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
</head>
<body class="{{body_class}}" data-csrf="{{csrf}}" data-flash="{{flash}}" data-flash-kind="{{flash_kind}}">
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/">BlitzForge</a>
    <form class="topsearch" action="/" method="get" role="search">
      <input type="search" name="q" placeholder="Поиск по каталогу" value="{{q}}" aria-label="Поиск модов">
    </form>
    <nav class="topnav" aria-label="Разделы">
      <a href="/" {{{nav_home}}}>Каталог</a>
      <a href="/compat" {{{nav_compat}}}>Совместимость</a>
      <a href="/docs" {{{nav_docs}}}>Как это работает</a>
      <a href="/download" {{{nav_download}}}>Установка</a>
      <a href="https://pd0-2.gitbook.io/blitzforge" rel="noopener">Документация</a>
      {{{nav_user}}}
    </nav>
  </div>
</header>
{{{notice}}}
<main>
{{{body}}}
</main>
<footer class="foot">
  <div class="foot-inner">
    <span>BlitzForge, клиент {{client_build}}</span>
    <span class="spacer"></span>
    <a href="/api/v1/index.json">index.json</a>
    <a href="/docs#api">API</a>
    <a href="/docs#security">Безопасность</a>
  </div>
</footer>
<script src="/static/app.js?v={{asset_v}}" defer></script>
</body>
</html>
