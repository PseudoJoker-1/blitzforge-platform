<div>
<h1>Аккаунт</h1>
<p class="muted">{{email}}, {{display_name}}, роль {{role_label}}. Почта {{verified}}.</p>
{{{verify_hint}}}

<section class="section two">
  <div>
    <h2>Стать разработчиком</h2>
    {{{application}}}
  </div>
  <div>
    <h2>Сменить пароль</h2>
    <form method="post" action="/account/password">
      <input type="hidden" name="csrf" value="{{csrf}}">
      <label class="field"><span>Текущий пароль</span><input type="password" name="current" required autocomplete="current-password"></label>
      <label class="field"><span>Новый пароль</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
      <button class="btn" type="submit">Сменить пароль</button>
    </form>
  </div>
</section>
</div>
