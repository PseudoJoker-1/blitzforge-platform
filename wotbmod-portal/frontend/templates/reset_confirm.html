<section class="auth rise">
  <h1>Новый пароль</h1>
  <form method="post" action="/reset/{{token}}">
    <label class="field"><span>Пароль, не короче 8 символов</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn btn-primary" type="submit">Сохранить пароль</button>
  </form>
</section>
