<section class="auth rise">
  <h1>Сбросить пароль</h1>
  <p class="muted">Пришлём ссылку на почту, если она зарегистрирована.</p>
  <form method="post" action="/reset">
    <label class="field"><span>Почта</span><input type="email" name="email" required autocomplete="email"></label>
    <button class="btn btn-primary" type="submit">Прислать ссылку</button>
  </form>
  <p class="after"><a href="/login">Вернуться ко входу</a></p>
</section>
