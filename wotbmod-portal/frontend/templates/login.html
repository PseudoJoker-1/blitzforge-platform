<section class="auth rise">
  <h1>Войти</h1>
  <form method="post" action="/login">
    <label class="field"><span>Почта</span><input type="email" name="email" required autocomplete="email"></label>
    <label class="field"><span>Пароль</span><input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
  <p class="after">Нет аккаунта? <a href="/register">Зарегистрироваться</a>. <a href="/reset">Забыли пароль?</a></p>
</section>
