<div class="page-head">
  <h1>Каталог модов</h1>
  <span id="count" class="muted">{{count_text}}</span>
</div>
<form id="searchform" class="searchrow" action="/" method="get" role="search">
  <input id="q" type="search" name="q" placeholder="Название, автор или id" value="{{q}}" autocomplete="off" aria-label="Поиск модов">
  <button class="btn" type="submit">Найти</button>
</form>
<div class="filters" role="group" aria-label="Фильтры">
  <button type="button" class="toggle" data-filter="type" data-value="lua" aria-pressed="{{p_lua}}">Lua</button>
  <button type="button" class="toggle" data-filter="type" data-value="native" aria-pressed="{{p_native}}">Нативные</button>
  <button type="button" class="toggle" data-filter="type" data-value="content" aria-pressed="{{p_content}}">Ресурсы</button>
  <button type="button" class="toggle" data-filter="tier" data-value="SAFE" aria-pressed="{{p_safe}}">Только безопасные права</button>
  <button type="button" class="toggle" data-filter="verified" data-value="1" aria-pressed="{{p_verified}}">Проверенные</button>
  <label class="sr-only" for="sort">Сортировка</label>
  <select id="sort" name="sort">{{{sort_options}}}</select>
</div>
<ul id="grid" class="list" aria-live="polite">
{{{cards}}}
</ul>
