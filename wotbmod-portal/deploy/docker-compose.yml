# docker compose -f deploy/docker-compose.yml up -d
# Put config.json (from config.example.json, with base_url = your https address)
# and data/portal.key next to this file's parent folder before the first start.
services:
  portal:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../config.json:/app/config.json:ro
      - ../data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
